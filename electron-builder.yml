appId: com.wallaceluis.english-assist
productName: English Assist
directories:
  output: release
files:
  - out/**/*
  # The tray and window icons are loaded from here at runtime.
  - resources/tray.png
  - resources/icon.png
  - package.json
# Where the installed app looks for new versions (see "Publicando uma versão" in the README).
publish:
  provider: github
  owner: wallaceluis
  repo: english-writing-assistant
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: English-Assist-Setup-${version}.${ext}
  shortcutName: English Assist
